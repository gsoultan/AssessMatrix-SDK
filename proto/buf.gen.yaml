# Generated code is committed so `go get` works without buf. CI regenerates
# and fails on any diff, so the stubs cannot drift from these files.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/gsoultan/assessmatrix-sdk/gen
plugins:
  - local: protoc-gen-go
    out: ../gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../gen
    opt: paths=source_relative
